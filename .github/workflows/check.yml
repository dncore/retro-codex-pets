name: check

on:
  push:
  pull_request:

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      # Full history: the scan covers commit metadata as well as file contents.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for home paths and credentials
        run: bash scripts/sanitize-check.sh

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install --quiet pillow
      - name: Validate every pet package
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          from PIL import Image
          bad = 0
          for pkg in sorted(pathlib.Path("pets").iterdir()):
              manifest = json.loads((pkg / "pet.json").read_text())
              sheet = Image.open(pkg / manifest["spritesheetPath"])
              ok = (
                  manifest.get("id") == pkg.name
                  and sheet.size == (1536, 2288)
                  and sheet.mode == "RGBA"
              )
              print(f"{pkg.name:<20} {sheet.size} {sheet.mode} id={manifest.get('id')} {'ok' if ok else 'BAD'}")
              bad += not ok
          sys.exit(f"{bad} package(s) failed validation" if bad else 0)
          PY
      - name: Previews match the atlases they ship with
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, pathlib, sys
          from PIL import Image
          bad = []
          for gif in sorted(glob.glob("previews/*.gif")):
              pet = pathlib.Path(gif).stem
              manifest = json.loads(pathlib.Path(f"pets/{pet}/pet.json").read_text())
              atlas = pathlib.Path(f"pets/{pet}") / manifest.get("spritesheetPath", "spritesheet.webp")
              im = Image.open(gif); im.load()
              note = im.info.get("comment", b"").decode("ascii", "replace")
              want = "atlas-sha256:" + hashlib.sha256(atlas.read_bytes()).hexdigest()
              ok = note == want
              print(f"{gif:<32} {'matches its atlas' if ok else 'STALE: ' + (note or 'no note')}")
              if not ok: bad.append(gif)
          sys.exit(f"stale previews: {bad}" if bad else 0)
          PY
